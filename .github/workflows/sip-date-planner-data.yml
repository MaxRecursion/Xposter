name: SIP Date Planner nightly data

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sip-date-planner
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sip-date-planner/pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: sip-date-planner/pipeline/.cache
          key: mfapi-${{ github.run_id }}
          restore-keys: mfapi-
      - run: pnpm install --frozen-lockfile
      - name: Previous fund count
        id: prev
        run: |
          if [ -f static/data/meta.json ]; then
            echo "count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('static/data/meta.json','utf8')).fundCount||0)")" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm pipeline
      - name: Upstream breakage guard
        run: |
          node <<'EOF'
          import { readFileSync } from 'node:fs';
          const prev = Number(process.env.PREV || 0);
          const next = JSON.parse(readFileSync('static/data/meta.json', 'utf8')).fundCount;
          if (prev > 0 && next < prev * 0.9) {
            console.error(`Fund count dropped more than 10%: ${prev} -> ${next}`);
            process.exit(1);
          }
          console.log(`fund count ${prev} -> ${next}`);
          EOF
        env:
          PREV: ${{ steps.prev.outputs.count }}
      - name: Commit data if changed
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "sip-date-planner-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sip-date-planner/static/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(sip-date-planner): nightly NAV artifacts"
            git push
          fi
